name: Ibd Flare Biomarker Engine CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[api,test]"

    - name: Run Pytest Suite
      run: |
        pytest -v

    - name: Compile Python sources
      run: python -m compileall -q agents ibd_flare_biomarker_agent cli.py ibd_sentinel.py enrichment.py

    - name: CLI smoke tests
      run: |
        python cli.py audit --task-id TEST --target SYNTH-1 --primary 10 --secondary 2 --status NOMINAL
        python cli.py verify-audit
        python -m ibd_flare_biomarker_agent.cli audit --case-id TEST --primary 1 --secondary 1

    - name: Check browser script syntax
      run: node --check web/app.js
